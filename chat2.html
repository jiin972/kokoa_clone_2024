<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat w/ Seongjin- Kokoa Clone</title>
    <!-- link CSS style sheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body id="chat-screen">
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="status-bar__column">
        <span>18:43</span>
      </div>
      <div class="status-bar__column">
        <span>110%</span>
        <i class="fa-solid fa-battery-full fa-lg"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <header class="alt-header">
      <div class="alt-header__column">
        <a href="chats.html"> <i class="fa-solid fa-angle-left fa-2x"></i></a>
      </div>
      <div class="alt-header__column">
        <h1 class="alt-header__title">정배</h1>
      </div>
      <div class="alt-header__column">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-bars fa-lg"></i></span>
      </div>
    </header>

    <main class="main-screen main-chat">
      <div class="message-row">
        <img
          src="https://i.namu.wiki/i/OLowAlv2lvFjEiRSMh8wBB6NOvs5VNcoudIenafKpw9NfjL9cm4zFYZIPRkZhgfvqCE24eiexwG5N3n9zckrf7XPdq-4ebUuM0kYzd571P7Vc9lTYA4n4R4PbAybT3vL5gyuc3oMPtVavtsdh4tC5g.webp"
        />
        <div class="message-row__content">
          <span class="message__author">정배</span>
          <div class="message__info">
            <span class="message__bubble"
              >비밀번호 바꾸셨네. 니네 엄마가 드디어 널 버렸다! 흐하하!</span
            >
            <span class="message__time">21:27</span>
          </div>
        </div>
        <div class="message__notice">1</div>
      </div>
      <div class="chat__timestamp">여기까지 읽으셨습니다.</div>
      <hr />
      <div class="chat__timestamp">Tuesday, June 30, 2020</div>
      <div class="message-row">
        <img
          src="https://i.namu.wiki/i/OLowAlv2lvFjEiRSMh8wBB6NOvs5VNcoudIenafKpw9NfjL9cm4zFYZIPRkZhgfvqCE24eiexwG5N3n9zckrf7XPdq-4ebUuM0kYzd571P7Vc9lTYA4n4R4PbAybT3vL5gyuc3oMPtVavtsdh4tC5g.webp"
        />
        <div class="message-row__content">
          <span class="message__author">정배</span>
          <div class="message__info">
            <span class="message__bubble"
              >기훈아,기훈아! 야, 그럼 여기를 왜 다시 들어왔냐?</span
            >
            <span class="message__time">21:27</span>
          </div>
        </div>
      </div>
      <div class="message-row message-row--own">
        <div class="message-row__content">
          <div class="message__info">
            <span class="message__bubble">정배야, 내 뒤에 꼭 붙어 있어!</span>
            <span class="message__time">21:27</span>
          </div>
        </div>
      </div>
    </main>
    <!--chat스크린의 입력창 부분 작성-->
    <form class="reply">
      <div class="reply__column">
        <i class="fa-regular fa-square-plus fa-lg"></i>
      </div>
      <div class="reply__column">
        <input type="text" placeholder="Write a Message..." />
        <i class="fa-regular fa-face-laugh-wink fa-lg"></i>
        <button>
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </form>

    <div id="no-mobile">
      <span>Your screen is super big 😢</span>
    </div>

    <!-- 코드킷 사용을 위한 scripts-->
    <script
      src="https://kit.fontawesome.com/9c07108d3b.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
