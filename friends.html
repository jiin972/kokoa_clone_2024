<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - Kokoa Clone</title>
    <!-- link CSS style sheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="status-bar__column">
        <span>18:43</span>
      </div>
      <div class="status-bar__column">
        <span>110%</span>
        <i class="fa-solid fa-battery-full fa-lg"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <header class="screen-header">
      <h1 class="screen-header__title">Firends</h1>
      <div class="screen-header__icon">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-music fa-lg"></i></span>
        <span>
          <a href="settings.html"> <i class="fa-solid fa-gear fa-lg"></i></a>
        </span>
      </div>
    </header>

    <a id="friends-display-link">
      <i class="fa-solid fa-circle-info"></i>
      Friends`Names Display
      <i class="fa-solid fa-chevron-right fa-xs"></i>
    </a>

    <main class="friends-screen">
      <div class="user-component">
        <div class="user-component__column">
          <img
            src="https://i.namu.wiki/i/k7p4Af2rLpy0Edk_GvGQ7xxilIDyvJB6FRMzpRMzive706CCJxV2Pm_HIZY-Z8x2HUXgoKzZpdlqY3-LNiXitETTrJKrrpM5bYpRw1mkl2GvalFu2iASfkmdmgYKHQO1zemxYtSgLbeEz20z0Z368A.webp"
            class="user-component__avatar user-component__avatar-xl"
          />
          <div class="user-component__text">
            <h4 class="user-component__title">456</h4>
            <h6 class="user-component__subtitle">
              널 찾아낼거야, 무슨 수를 써서라도..
            </h6>
          </div>
        </div>
      </div>

      <div class="friends-screen__channel">
        <div class="friends-screen__channel-header">
          <span>Competitor</span>
          <i class="fa-solid fa-angle-up fa-lg"></i>
        </div>

        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/M2Jst1K04lnPdyjSGgTsmB2yyz2JKg1SWGrzx9cEo4yiKS5N4MtnaoSx_zHwHheWPUAKXviR3tlJJZdYkllsNrJF6C0aslrslMIUaOHSSsUbd763i8xTNYYSEX_JvEorJpMmRU0JR_jaB_QFsTtBPg.webp"
              class="user-component__avatar user-component__avatar-sm"
            />
            <div class="user-component__text">
              <h4 class="user-component__title user-component__title--not-bold">
                390
              </h4>
              <h5>행복, 사랑, 건강 오늘도 화이팅👏</h5>
            </div>
          </div>
          <div class="user-component__column">
            <div>
              <span>2</span> <i class="fa-solid fa-angle-right fa-lg"></i>
            </div>
          </div>
        </div>
        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/lPdon7hsJ2vpL8PJIKNRVqnNkeHAhCPt_LEDca-fWTBYN6bUhl3vDM15pmIAkl3AhJP_W9k-jOwRx03-VMo1zKvozaPUXV8WvhhVS6HapzryVl_00YSz33PTAOJBLbz2YVW-YRq93b9qO4L2unzQNA.webp"
              class="user-component__avatar user-component__avatar-sm"
            />
            <div class="user-component__text">
              <h4 class="user-component__title user-component__title--not-bold">
                120
              </h4>
              <h5>답장늦음..그러나 꼭 답장은 함.</h5>
            </div>
          </div>
          <div class="user-component__column">
            <div>
              <span>1</span> <i class="fa-solid fa-angle-right fa-lg"></i>
            </div>
          </div>
        </div>
        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/OLowAlv2lvFjEiRSMh8wBB6NOvs5VNcoudIenafKpw9NfjL9cm4zFYZIPRkZhgfvqCE24eiexwG5N3n9zckrf7XPdq-4ebUuM0kYzd571P7Vc9lTYA4n4R4PbAybT3vL5gyuc3oMPtVavtsdh4tC5g.webp"
              class="user-component__avatar user-component__avatar-sm"
            />
            <div class="user-component__text">
              <h4 class="user-component__title user-component__title--not-bold">
                007
              </h4>
              <h5>3년안에 효도한다.😎</h5>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a class="nav__a" href="friends.html">
            <i class="fa-solid fa-user fa-2x"></i>
          </a>
        </li>
        <li class="nav__btn">
          <a class="nav__a" href="chats.html">
            <i class="fa-regular fa-comment fa-2x"></i>
            <span class="nav__notification badge-normal">3</span>
          </a>
        </li>
        <li class="nav__btn">
          <a class="nav__a" href="find.html">
            <i class="fa-solid fa-magnifying-glass fa-2x"></i>
          </a>
        </li>
        <li class="nav__btn">
          <a class="nav__a" href="more.html">
            <i class="fa-solid fa-ellipsis fa-2x"></i>
            <div class="nav__notidot badge-small"></div>
          </a>
        </li>
      </ul>
    </nav>

    <!--splash screen part-->
    <div id="splash-screen">
      <i class="fa-solid fa-comment"></i>
    </div>

    <div id="no-mobile">
      <span>Your screen is super big :(</span>
    </div>

    <!-- 코드킷 사용을 위한 scripts-->
    <script
      src="https://kit.fontawesome.com/9c07108d3b.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
